<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="referrer" content="no-referrer" />
  <title>ScreenWatch Viewer</title>
  <style>
    body {
      font-family: -apple-system, Segoe UI, sans-serif;
      background: #111;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      margin: 0;
    }
    #nameInput {
      font-size: 16px;
      width: min(320px, 60vw);
      padding: 10px;
    }
    #inviteBox { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 12px; }
    #inviteBox[hidden] { display: none; }
    #inviteLink {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
      color: #4ade80;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px 12px;
      max-width: min(560px, 90vw);
      word-break: break-all;
      user-select: all;
    }
    .hint { color: #888; font-size: 12px; }
    button { margin-left: 8px; padding: 9px 16px; font-size: 16px; cursor: pointer; }
    #status { color: #999; margin: 12px 0 4px; font-size: 14px; text-align: center; }
    #timer { color: #f59e0b; font-size: 13px; min-height: 16px; }
    video {
      width: 90vw;
      max-width: 1000px;
      background: #000;
      margin-top: 12px;
      border: 1px solid #333;
      outline: none;
    }
    video.controllable { cursor: crosshair; }
    video.controllable:focus { border-color: #4ade80; }
    #controlRow {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #ccc;
    }
    #controlRow label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    #controlRow label.disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="inviteForm">
    <input id="nameInput" placeholder="Your name (shown to them)" maxlength="100" autocomplete="on" />
    <button id="inviteBtn">Create invite</button>
  </div>
  <div id="inviteBox" hidden>
    <div id="inviteLink"></div>
    <button id="copyBtn">Copy link</button>
    <div class="hint">Send this link to the person. Keep this page open until they accept.</div>
  </div>
  <div id="status">Create an invite and send the link to the person whose screen you want to see</div>
  <div id="timer"></div>
  <video id="remoteVideo" autoplay playsinline tabindex="0"></video>
  <div id="controlRow">
    <label class="disabled" id="controlLabel">
      <input type="checkbox" id="controlCheckbox" disabled />
      Take control (mouse &amp; keyboard) — click the video first, then check this
    </label>
  </div>

  <script src="viewer.js"></script>
</body>
</html>
